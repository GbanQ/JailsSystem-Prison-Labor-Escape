        - "&3Великие империи"
        - "&dТайны прошлого"
    law:
      name: "Право"
      book-names:
        - "&2Конституция"
        - "&8Уголовный кодекс"
        - "&5Судебные прецеденты"
        - "&cПрава заключённых"
        - "&6Административное право"
        - "&bМеждународное право"
    medicine:
      name: "Медицина"
      book-names:
        - "&dАнатомия человека"
        - "&bПервая помощь"
        - "&3Фармакология"
        - "&fХирургические методы"
