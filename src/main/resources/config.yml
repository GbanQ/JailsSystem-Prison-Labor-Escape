# ================ СООБЩЕНИЯ ОБ AFK ================
afk-messages:
  on: "&eВы находитесь в состоянии AFK. Ваше время заключения идет медленнее."
  off: "&eВы вышли из состояния AFK. Время заключения теперь идет в обычном режиме."